name: Manual CodeQL security scan

on:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Runner pool for this manual CodeQL scan"
        required: true
        default: local
        type: choice
        options:
          - local
          - hosted

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ inputs.runner_mode == 'hosted' && matrix.hosted_runner || matrix.runner }}
    timeout-minutes: ${{ contains(matrix.runner, '-i5-') && 180 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - language: actions
            runner: sudoku-buddy-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: c-cpp
            runner: sudoku-buddy-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: java-kotlin
            runner: sudoku-buddy-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: javascript-typescript
            runner: sudoku-buddy-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: python
            runner: sudoku-buddy-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: swift
            runner: sudoku-buddy-macmini
            hosted_runner: macos-15
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
