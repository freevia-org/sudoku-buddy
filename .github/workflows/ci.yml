name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# Keep manually dispatched builds running so each requested commit can produce artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name "build" is the required status check on main; keep it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Seconds-long checks run before any JDK/SDK/Gradle setup so a broken translation,
      # site source or release safeguard fails the run in well under a minute.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test release safeguards
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Validate bundled translations
        run: |
          python3 -m unittest discover -s tools/i18n -p 'test_*.py'
          python3 tools/i18n/validate.py

      - name: Validate website and policy sources
        run: |
          python3 -m pip install -r tools/site/requirements.txt
          python3 tools/site/build-site.py --check
          python3 -m unittest discover -s tools/site -p 'test_*.py'

      # Keep the report intake, retention and export lifecycle covered by the same
      # required check as the app; these tests use local fakes and need no secrets.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test feedback API
        run: npm test --prefix feedback-api

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-jdk-gradle

      # Corpus photographs are not in the repository, so every test that needs one
      # skips here. That is expected: see docs/superpowers/plans.
      # The release APK is excluded here only because the next Gradle step builds it
      # with the real version code and signing key; building it twice cost ~50s.
      - name: Build and test
        run: ./gradlew build -x :app:assembleRelease --console=plain

      # Without this the release is signed with a debug key generated on this runner,
      # which differs from the one the last runner made - and testers cannot update
      # across a signature change, they have to uninstall and lose everything.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; this release is debug-signed and cannot be uploaded to Play."
          fi

      # One Gradle invocation for the release APK, its alignment check and the Play
      # bundle (checkNativeAlignment depends on assembleRelease).
      # Play refuses native libraries built for 4 KB pages, and they do not fail
      # gracefully - they fail to load on a 16 KB device, which is a phone no build here
      # runs on. The check reads the ELF headers, so it catches a dependency regressing.
      # The bundle is what Play takes. The APK is for installing directly on a phone; the
      # bundle carries all four ABIs and lets Play send each phone only its own. Releases
      # to Play are built separately by play-candidate.yml, from a reviewed commit.
      - name: Assemble release APK and Play bundle, check 16 KB alignment
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:checkNativeAlignment :app:bundleRelease --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: sudoku-buddy-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: sudoku-buddy-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
