name: Play candidate (no distribution)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Final reviewed commit SHA to build
        required: true
        type: string
      version_code:
        description: Integer greater than every code already uploaded to Play
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ inputs.version_code }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Check immutable revision and version code
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Use a full commit SHA'; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Use a positive version code'; exit 1; }
          test "$BUILD_NUMBER" -le 2100000000
          test "$(git rev-parse HEAD)" = "${CANDIDATE_REVISION,,}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned APK verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore required signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing signing key; refusing candidate'; exit 1; }
          test -n "$SIGNING_KEYSTORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/play-upload.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"
      - name: Verify signing configuration
        run: ./gradlew :app:checkReleaseSigning --console=plain
      - name: Test the offline bundle audit
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Build and check final sources
        run: ./gradlew build :app:checkNativeAlignment :app:bundleRelease --console=plain
      - name: Validate bundle and record evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence=build/play-candidate-evidence
          mkdir -p "$evidence"
          gh release download 1.18.3 --repo google/bundletool --pattern bundletool-all-1.18.3.jar --dir "$RUNNER_TEMP"
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          bundle=app/build/outputs/bundle/release/app-release.aab
          java -jar "$bundletool" validate --bundle="$bundle" > "$evidence/bundle-validation.txt"
          java -jar "$bundletool" dump manifest --bundle="$bundle" --module=base > "$evidence/manifest.xml"
          java -jar "$bundletool" dump config --bundle="$bundle" > "$evidence/bundle-config.json"
          python3 tools/release/check_play_bundle.py "$bundle" --manifest "$evidence/manifest.xml" --config "$evidence/bundle-config.json" --version-code "$BUILD_NUMBER" > "$evidence/bundle-audit.txt"
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify -verbose -certs "$bundle" > "$evidence/signature-verification.txt"
          grep -Fq 'jar verified.' "$evidence/signature-verification.txt"
          # jarsigner can report success even when extra payload entries are unsigned.
          if grep -Fiq 'unsigned entries' "$evidence/signature-verification.txt"; then
            echo 'Bundle contains unsigned entries'; exit 1
          fi
          keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$bundle" > "$evidence/upload-certificate.txt"
          grep -Fqi 'A5:10:D8:2B:87:E7:06:9B:53:D5:20:BE:CA:91:5B:35:2A:E9:6C:EA:85:0C:68:CA:00:61:17:E3:5D:75:D3:E5' "$evidence/upload-certificate.txt"
          # Generate all device variants locally; nothing is installed or distributed.
          umask 077
          store_password="$RUNNER_TEMP/play-store-password"
          key_password="$RUNNER_TEMP/play-key-password"
          trap 'rm -f "$store_password" "$key_password"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_PASSWORD" > "$store_password"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$key_password"
          java -jar "$bundletool" build-apks --bundle="$bundle" --output="$RUNNER_TEMP/candidate.apks" \
            --ks="$SIGNING_KEYSTORE" --ks-key-alias="$SIGNING_KEY_ALIAS" \
            --ks-pass="file:$store_password" --key-pass="file:$key_password" > "$evidence/generated-apks.txt"
          mkdir -p "$RUNNER_TEMP/candidate-apks"
          unzip -q "$RUNNER_TEMP/candidate.apks" -d "$RUNNER_TEMP/candidate-apks"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          count=0
          while IFS= read -r -d '' apk; do
            "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
            grep -Fiq 'a510d82b87e7069b53d520beca915b352ae96cea850c68ca006117e35d75d3e5' "$RUNNER_TEMP/apk-signature.txt"
            printf '\n%s\n' "${apk#"$RUNNER_TEMP/candidate-apks/"}" >> "$evidence/generated-apk-signature.txt"
            cat "$RUNNER_TEMP/apk-signature.txt" >> "$evidence/generated-apk-signature.txt"
            "$tools/zipalign" -c -P 16 -v 4 "$apk" >> "$evidence/generated-apk-alignment.txt"
            count=$((count + 1))
          done < <(find "$RUNNER_TEMP/candidate-apks" -type f -name '*.apk' -print0)
          test "$count" -gt 0
          printf '\nVerified %s generated APKs; no installation performed.\n' "$count" >> "$evidence/generated-apks.txt"
          python3 tools/release/package_candidate.py prepare --bundle "$bundle" --evidence "$evidence" --output release-candidate --version-code "$BUILD_NUMBER"
          python3 tools/release/package_candidate.py verify release-candidate
      - name: Archive candidate for review only
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-buddy-play-candidate-${{ inputs.version_code }}
          path: release-candidate/
          if-no-files-found: error
      - name: Archive tests and lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-buddy-candidate-checks-${{ inputs.version_code }}
          path: |
            **/build/reports/tests/**
            app/build/reports/lint-results*
            build/play-candidate-evidence/**
          if-no-files-found: warn
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-upload.jks" "$RUNNER_TEMP/play-store-password" "$RUNNER_TEMP/play-key-password"
